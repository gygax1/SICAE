<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Usuario | Sistema de Asistencia Escolar</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
  <main class="login-shell wide">
    <section class="login-card">
      <img src="img/logo.png" alt="Logo CECyTE" class="login-logo">
      <h1>Registro de usuario</h1>
      <p class="login-sub">Alta de cuentas para roles docente o dirección.</p>

      <form id="formRegistroUsuario" class="login-form" autocomplete="off">
        <label>
          Tipo de usuario
          <select id="rol" required>
            <option value="docente">Docente</option>
            <option value="direccion">Dirección</option>
          </select>
        </label>

        <label>
          Nombre completo
          <input id="nombreCompleto" type="text" required>
        </label>

        <label>
          Teléfono
          <input id="telefono" type="tel" required>
        </label>

        <label>
          Correo
          <input id="correo" type="email" required>
        </label>

        <label>
          CURP
          <input id="curp" type="text" maxlength="18" required>
        </label>

        <label>
          Año de nacimiento
          <input id="anioNacimiento" type="number" min="1900" max="2100" required>
        </label>

        <label>
          Sexo
          <select id="sexo" required>
            <option value="">Selecciona</option>
            <option value="M">Masculino</option>
            <option value="F">Femenino</option>
            <option value="X">Prefiero no decir</option>
          </select>
        </label>

        <label>
          Usuario
          <input id="username" type="text" required>
        </label>

        <label>
          Contraseña
          <input id="password" type="password" minlength="6" required>
        </label>

        <label>
          Contraseña maestra
          <input id="masterPassword" type="password" required>
        </label>

        <!-- Asignación de tarjeta NFC -->
        <div class="nfc-asignacion-usuario">
          <p class="nfc-label">Tarjeta NFC <span class="nfc-label-opt">(opcional)</span></p>
          <div class="nfc-uid-display">
            <span id="tarjetaUIDLabel">Sin tarjeta asignada</span>
            <button type="button" id="btnLeerTarjeta" class="btn-leer-tarjeta" onclick="toggleLecturaTarjeta()">
              Leer tarjeta
            </button>
          </div>
          <p id="estadoNFCReg" class="login-msg" style="display:none;"></p>
        </div>

        <button type="submit" id="btnRegistrarUsuario" class="btn-login">Registrar usuario</button>
      </form>

      <div class="login-alt-actions">
        <a class="btn-plantilla" href="login.html">Volver a login</a>
      </div>

      <p id="registroMsg" class="login-msg">La contraseña maestra es obligatoria para registrar cualquier usuario.</p>
    </section>
  </main>

  <style>
    .nfc-asignacion-usuario {
      border: 1.5px dashed #90caf9;
      border-radius: 8px;
      padding: 12px 14px;
      margin: 4px 0 10px;
      background: #f0f7ff;
    }
    .nfc-label { font-size: .85rem; color: #555; margin: 0 0 6px; font-weight: 600; }
    .nfc-label-opt { font-weight: 400; color: #999; }
    .nfc-uid-display {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .nfc-uid-display span {
      flex: 1;
      font-family: monospace;
      font-size: .9rem;
      color: #333;
    }
    .btn-leer-tarjeta {
      background: #1976d2;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: .85rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-leer-tarjeta.activo { background: #c62828; }
    .btn-leer-tarjeta:hover { filter: brightness(1.1); }
  </style>

  <script src="js/storage.js?v=20260310b"></script>
  <script src="js/auth.js?v=20260312b"></script>
  <script>
    const form   = document.getElementById("formRegistroUsuario");
    const msg    = document.getElementById("registroMsg");
    const btn    = document.getElementById("btnRegistrarUsuario");

    let tarjetaUID = "";
    let nfcLeyendo = false;

    function setMsg(texto, tipo = "info") {
      msg.textContent = texto;
      msg.className   = `login-msg ${tipo}`;
    }

    function setNFCMsg(texto, tipo = "info") {
      const el = document.getElementById("estadoNFCReg");
      el.textContent   = texto;
      el.className     = `login-msg ${tipo}`;
      el.style.display = texto ? "block" : "none";
    }

    function actualizarUITarjeta() {
      const label = document.getElementById("tarjetaUIDLabel");
      label.textContent = tarjetaUID || "Sin tarjeta asignada";
      label.style.color = tarjetaUID ? "#2e7d32" : "#757575";
    }

    function toggleLecturaTarjeta() {
      const btnT = document.getElementById("btnLeerTarjeta");

      if (nfcLeyendo) {
        detenerNFCLogin();
        nfcLeyendo = false;
        btnT.textContent = "Leer tarjeta";
        btnT.classList.remove("activo");
        setNFCMsg("", "");
        return;
      }

      nfcLeyendo = true;
      btnT.textContent = "Cancelar";
      btnT.classList.add("activo");
      setNFCMsg("Acerca la tarjeta al lector...", "info");

      iniciarNFCLogin({
        onUID: uid => {
          detenerNFCLogin();
          nfcLeyendo = false;
          btnT.textContent = "Leer tarjeta";
          btnT.classList.remove("activo");
          tarjetaUID = uid;
          actualizarUITarjeta();
          setNFCMsg(`Tarjeta asignada: ${uid}`, "ok");
        },
        onError: () => {
          setNFCMsg("Error al leer el lector NFC.", "error");
        }
      });
    }

    function validarCurp(curp) {
      return /^[A-Z]{4}[0-9]{6}[A-Z0-9]{8}$/.test(curp);
    }

    form.addEventListener("submit", async e => {
      e.preventDefault();

      const rol           = document.getElementById("rol").value.trim().toLowerCase();
      const nombreCompleto = document.getElementById("nombreCompleto").value.trim();
      const telefono      = document.getElementById("telefono").value.trim();
      const correo        = document.getElementById("correo").value.trim().toLowerCase();
      const curp          = document.getElementById("curp").value.trim().toUpperCase();
      const anioNacimiento = Number(document.getElementById("anioNacimiento").value);
      const sexo          = document.getElementById("sexo").value.trim().toUpperCase();
      const username      = document.getElementById("username").value.trim().toLowerCase();
      const password      = document.getElementById("password").value;
      const masterPassword = document.getElementById("masterPassword").value;

      if (!rol || !nombreCompleto || !telefono || !correo || !curp || !anioNacimiento || !sexo || !username || !password || !masterPassword) {
        setMsg("Completa todos los campos obligatorios.", "error");
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) {
        setMsg("Correo inválido.", "error");
        return;
      }

      if (!validarCurp(curp)) {
        setMsg("CURP inválida (debe tener 18 caracteres válidos).", "error");
        return;
      }

      const anioActual = Number(new Date().toLocaleDateString("en-CA", { timeZone: "America/Mexico_City" }).slice(0, 4));
      if (!Number.isFinite(anioNacimiento) || anioNacimiento < 1900 || anioNacimiento > anioActual) {
        setMsg("Año de nacimiento inválido.", "error");
        return;
      }

      if (password.length < 6) {
        setMsg("La contraseña debe tener al menos 6 caracteres.", "error");
        return;
      }

      btn.disabled = true;
      setMsg("Registrando usuario...", "info");

      try {
        const out = await appAuthRegisterUser({
          rol,
          nombre_completo: nombreCompleto,
          telefono,
          correo,
          curp,
          anio_nacimiento: anioNacimiento,
          sexo,
          username,
          password,
          master_password: masterPassword
        });

        if (!out?.ok) {
          setMsg(out?.message || "No se pudo registrar el usuario.", "error");
          return;
        }

        // Si se asignó tarjeta, actualizar el usuario recién creado
        if (tarjetaUID && out.user?.id) {
          await appActualizarUsuario({ id: out.user.id, tarjeta_uid: tarjetaUID });
        }

        setMsg("Usuario registrado correctamente. Redirigiendo...", "ok");
        setTimeout(() => { location.href = "login.html"; }, 900);
      } catch (err) {
        setMsg(err?.message || "No se pudo registrar el usuario.", "error");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
